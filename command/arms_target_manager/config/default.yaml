/**:
  ros__parameters:
    # 手柄/键盘：满杆最大线速度 (m/s)。与旧步进 scale 对齐：scale_vel ≈ scale_old * control_input_rate
    # 例：旧 linear_scale=0.005、发布约 50 Hz → 0.005 * 50 = 0.25
    linear_scale: 0.25

    # 手柄/键盘：满杆最大角速度 (rad/s)。例：旧 0.05 * 50 = 2.5
    angular_scale: 2.5

    # control_input 典型发布频率 (Hz)，仅用于文档/手感对齐估算；控制器按自身 dt 积分 twist
    control_input_rate: 50.0

    # VR摇杆：线性缩放因子（单位 m/step）
    vr_thumbstick_linear_scale: 0.005

    # VR摇杆：角度缩放因子（单位 rad/step）
    vr_thumbstick_angular_scale: 0.05

    # VR手柄位姿缩放因子（左右共用，可由组合键动态校准，范围建议 [0.75, 1.5]）
    vr_pose_scale: 1.0

    # 是否启用VR输入处理
    enable_vr: false
